[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptograph-secure"
version = "0.1.0"
description = "A cybersecurity-focused deep learning framework analyzing cryptocurrency shock propagation and anomaly resilience using Temporal Graph Neural Networks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary, all rights reserved (pending IP review)" }
authors = [
    { name = "CryptoGraph-Secure Team" }
]
keywords = [
    "cryptocurrency",
    "graph-neural-networks",
    "spatio-temporal",
    "cybersecurity",
    "anomaly-detection",
    "adversarial-robustness",
    "spillover-effects"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment"
]

dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "torch-geometric-temporal>=0.54.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "ccxt>=4.0.0",
    "yfinance>=0.2.30",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "pyvis>=0.3.2",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.9.0",
    "ipykernel>=6.25.0"
]

[project.scripts]
cryptograph-data = "cryptograph.pipelines.data:main"
cryptograph-train = "cryptograph.pipelines.train:main"
cryptograph-eval = "cryptograph.pipelines.evaluate:main"
cryptograph-explain = "cryptograph.pipelines.explain:main"
cryptograph-package = "cryptograph.pipelines.package_data:main"
cryptograph-predict = "cryptograph.pipelines.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
