# Daily 20-coin reference data configuration
source: "yfinance"
tickers:
  - "BTC-USD"
  - "ETH-USD"
  - "BNB-USD"
  - "SOL-USD"
  - "XRP-USD"
  - "DOGE-USD"
  - "ADA-USD"
  - "AVAX-USD"
  - "LINK-USD"
  - "DOT-USD"
  - "TRX-USD"
  - "BCH-USD"
  - "LTC-USD"
  - "NEAR-USD"
  - "XLM-USD"
  - "ETC-USD"
  - "ATOM-USD"
  - "XMR-USD"
  - "FIL-USD"
  - "SHIB-USD"

period: "10y"
interval: "1d"
resolution: "1d"
lookback_window: 30
forecast_horizons: [1, 3, 7, 14, 30]

graph:
  correlation_metric: "pearson"
  rolling_window: 30
  threshold: 0.40
  top_k: 5
  use_adaptive_adjacency: true

paths:
  raw_file: "data/raw/crypto_top20_10y_1d.parquet"
  processed_file: "data/processed/crypto_graph_dataset.pt"
