# =============================================================================
# CryptoGraph-Secure — hourly (Binance) data configuration
# Loaded by cryptograph.data.config.load_hourly_config. Stage 1 (universe audit)
# uses window/splits/universe/binance; Stages 2-3 add retrieval and preprocessing keys.
# Prices are quoted in USDT, not USD.
# =============================================================================
resolution: "1h"                 # 2h is resampled from 1h for the robustness check
dataset_version: "v2"
seed: 42

window:
  start: "2020-01-01T00:00:00Z"
  end: "2026-09-27T23:00:00Z"   # last hour, inclusive
  reference_date: "2026-09-27"   # market-cap ranking date (CoinGecko snapshot fetched 2026-09-28)

splits:                          # same dates as daily; train now starts 2020 (COVID, China ban, Terra)
  train: ["2020-01-01", "2022-06-30"]
  val:   ["2022-07-01", "2023-12-31"]
  test:  ["2024-01-01", "2026-09-27"]
  embargo_days: 7

universe:
  target_size: 30
  candidate_pool: 60             # top-60 non-stable coins are audited; the first 30 that pass are selected
  quote_asset: "USDT"
  min_history_days: 730          # >= 2 years of hourly data inside the window
  min_test_coverage: 0.90        # >= 90% of test-period hours (2024-01-01 .. 2026-09-27) with data
  identity_price_tolerance: 0.10 # Binance last close vs CoinGecko reference price
  # Not independent shock nodes (matched on CoinGecko symbol or id).
  stablecoins: [usdt, usdc, dai, fdusd, usde, tusd, pyusd, usds, usd1, usdg, rlusd, busd, usdd, gusd,
                frax, lusd, usdp, usdy, usyc, buidl, eurc, susds, susde, usdtb, usdf, usdx, crvusd, gho,
                u, united-stables, usdgo, bfusd]
  wrapped_or_staked: [wbtc, weth, steth, wsteth, weeth, cbbtc, cbeth, reth, wbeth, bnsol, jitosol,
                      msol, ezeth, rseth, lbtc, solvbtc, meth, tbtc, clbtc, wbnb, weth.e]
  rwa_or_pegged: [xaut, paxg, figr_heloc, eursafo]   # tokenised gold / loans / funds: price set off-chain
  # Event coins (kept for event studies, not model coins). Binance symbol history, oldest first.
  # LUNAUSDT is two different coins: the original Terra LUNA traded until its delisting in May 2022;
  # the same symbol was reused for the new LUNA (Terra 2.0) from 2022-05-31. Only the old segment is LUNC.
  event_coins:
    LUNC:
      - {symbol: LUNAUSDT, until: "2022-05-13"}
      - {symbol: LUNCUSDT}
    FTT:
      - {symbol: FTTUSDT}
  # Ticker migrations on Binance (coingecko id -> symbol history, oldest first). Verified in Stage 2.
  symbol_overrides:
    polygon-ecosystem-token:
      - {symbol: MATICUSDT, until: "2024-09-10"}   # verified: last MATICUSDT hour 2024-09-10 02:00, POLUSDT from 2024-09-13 10:00 (1:1, -0.7%)
      - {symbol: POLUSDT}
    render-token:
      - {symbol: RNDRUSDT, until: "2024-07-26"}
      - {symbol: RENDERUSDT}
    the-open-network:                # CoinGecko symbol is now "gram"; TONUSDT files end 2026-06-30, GRAMUSDT continues
      - {symbol: TONUSDT, until: "2026-06-30"}
      - {symbol: GRAMUSDT}

  # Yahoo daily tickers that Yahoo search does not return (still verified against the reference price).
  yahoo_tickers:
    polygon-ecosystem-token: POL28321-USD
    jupiter-exchange-solana: JUP29210-USD   # Yahoo "JUP-USD" is a different token (price ~0.0003)

binance:
  archive_url: "https://data.binance.vision"
  list_url: "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"
  market: "spot"
  interval: "1h"
  retries: 5
  backoff_base_seconds: 2.0
  download_workers: 8

quality:
  max_ffill_hours: 2             # forward-fill at most 2 consecutive missing hours (flagged); longer gaps masked
  stale_hours: 6                 # close unchanged for >= 6 consecutive hours -> flagged
  volume_spike_mult: 20          # volume > 20x trailing 7-day median -> flagged
  volume_spike_window_hours: 168
  abs_logret_flag: 0.25          # |hourly log return| > 0.25 is checked against the daily source / events
  daily_confirm_logret: 0.10     # a same-day daily move of >= 10% (log) confirms it
  event_window_days: 3
  crosscheck_tol: 0.01           # hourly-derived daily close vs daily dataset: flag differences > 1%
  usdt_peg_tol: 0.005            # USDT off its peg by > 0.5% -> day flagged (Coin Metrics, daily; ends 2026-05-23)
  rename_max_price_jump: 0.05    # ticker migrations are 1:1 swaps: price should not jump across the switch

paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim/hourly"
  processed_dir: "data/processed"
  external_dir: "data/external"
  reports_dir: "reports"
  coingecko_snapshot: "data/raw/coingecko/markets_snapshot.json"
  daily_audit: "reports/universe_audit.csv"
