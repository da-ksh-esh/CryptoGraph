# Hourly 30-coin Binance target data configuration
source: "binance_archive"
quote_asset: "USDT"
resolution: "1h"
fallback_resolution: "2h"
reference_resolution: "1d"
target_coins_count: 30

start_date: "2024-01-01"
end_date: "2026-09-27"
embargo_days: 7

# Horizons are stored/reported in wall-clock hours; the 2h pipeline converts them to bars.
horizons_hours: [1, 3, 6, 12, 24]
horizons_hours_2h: [2, 4, 6, 12, 24]

features:
  rolling_windows_hours: [24, 72, 168]
  include_parkinson: true
  exclude_garman_klass: true
  seasonality_adjustment: true

paths:
  raw_dir: "data/raw/binance/1h"
  processed_dir: "data/processed/v2/1h"
