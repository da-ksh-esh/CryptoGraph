# Data collection and dynamic graph builder configuration
source: "yfinance"
tickers:
  - "BTC-USD"
  - "ETH-USD"
  - "BNB-USD"
  - "SOL-USD"
  - "XRP-USD"
  - "DOGE-USD"
  - "ADA-USD"
  - "AVAX-USD"
  - "LINK-USD"
  - "DOT-USD"
  - "TRX-USD"
  - "BCH-USD"
  - "LTC-USD"
  - "NEAR-USD"
  - "XLM-USD"
  - "ETC-USD"
  - "ATOM-USD"
  - "XMR-USD"
  - "FIL-USD"
  - "SHIB-USD"

period: "10y"
interval: "1d"
lookback_window: 30          # 30 days lookback sequence for TGNN
forecast_horizons: [1, 3, 7, 14, 30]  # Forecast 1, 3, 7, 14, 30 days ahead

graph:
  correlation_metric: "pearson" # or "dcc_garch", "granger"
  rolling_window: 30            # Rolling window days to compute dynamic edges
  threshold: 0.40               # Minimum correlation to form an edge
  top_k: 5                      # Minimum degree guarantee if using top_k
  use_adaptive_adjacency: true  # Learn dynamic latent edge matrix

paths:
  raw_file: "data/raw/crypto_top20_10y_1d.parquet"
  processed_file: "data/processed/crypto_top20_processed.pt"
