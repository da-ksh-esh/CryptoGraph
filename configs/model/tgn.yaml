# Contagion Predictor: Temporal Graph Network (CryptoTGN) Configuration
model:
  type: "tgn"
  num_nodes: 30
  raw_msg_dim: 9
  memory_dim: 64
  time_dim: 16
  embedding_dim: 64
  out_horizons: 5
  dropout: 0.2

data:
  dataset_path: "data/processed/v2/1h/processed_dataset.pt"
  network_features_path: "data/processed/v2/network_features.pt"
  resolution: "1h"

training:
  learning_rate: 0.0005
  weight_decay: 1.0e-5
  max_epochs: 4
  patience: 2
  batch_size: 256
  pos_weight: 10.0
  grad_accum_steps: 32
