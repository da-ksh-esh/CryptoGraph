# ContagionTGN architecture (models/tgn.py), read by training/tgn_task.py. Training settings (epochs, learning rate,
# loss, early stopping, seeds) live in the experiment configs (configs/experiment/tgn_1h_*.yaml); experiments can
# override these keys under `model.overrides`.
memory_dim: 64          # TGNMemory state per coin (GRU)
time_dim: 16            # time encoding of event age
embedding_dim: 64       # attention embedding over each coin's 10 most recent events
dropout: 0.2            # head dropout
use_memory: true        # false = ablation (tgn_1h_nomem_final_v3): head sees node features and message only
context_features: false # true = + event context (dev variants only)
