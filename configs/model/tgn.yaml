# Main model: Temporal Graph Network (PyG TGNMemory) on the shock-triggered hourly event stream.
# Draft values for the training phase; tuned on validation only (docs/model_plan.md).
model_name: "CryptoTGN"
num_nodes: 30           # graph coins (event coins LUNC/FTT excluded)
raw_msg_dim: 5          # lag-1 corr, same-hour corr, source return, source volatility, source shock flag
memory_dim: 64
time_dim: 16
embedding_dim: 64
out_horizons: 5         # contagion labels: j shocks within k = 1, 3, 6, 12, 24 hours
dropout: 0.2
node_features: ["panel", "network"]   # panel.pt features at t + network_features.pt (latest snapshot <= t)

training:
  resolution: "1h"      # 2h = robustness check
  epochs: 50
  batch_size: 200       # events per batch, in time order
  learning_rate: 0.0005
  weight_decay: 1.0e-4
  patience: 8           # early stopping on validation AUPRC (k = 1h)
  loss: "focal"         # or weighted_bce with pos_weight from the train positive rate
