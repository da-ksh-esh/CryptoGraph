# DyGFormer (Yu et al., NeurIPS 2023), compact re-implementation in cryptograph.models.dygformer (no external library):
# each coin's last `max_input_sequence_length` interactions, neighbour co-occurrence encoding, patches of `patch_size`,
# a Transformer over both coins' patches, and the same 5-horizon head as the TGN.
# Sized for 30 coins: history 16 in patches of 2 (8 tokens per coin), width 32, no dropout inside the encoder
# (profiling: its random masks cost ~40% of CPU time); dropout 0.2 in the head.
model_name: "DyGFormer"
max_input_sequence_length: 16
patch_size: 2
d_model: 32
num_layers: 2
num_heads: 2
dropout: 0.2
encoder_dropout: 0.0
