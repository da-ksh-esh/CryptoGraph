# DyGFormer Adapter Configuration
model:
  type: "dygformer"
  in_features: 9
  patch_size: 4
  hidden_dim: 64
  num_heads: 4
  num_layers: 2
  out_horizons: 5
  dropout: 0.2

data:
  lookback_window: 24

training:
  learning_rate: 0.0005
  weight_decay: 1.0e-5
  batch_size: 128
  max_epochs: 4
  patience: 2
  pos_weight: 10.0
