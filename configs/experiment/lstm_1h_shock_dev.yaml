# LSTM (no graph), 1h data, development run (validation only). T2 next-hour shock; baseline to beat: logistic rules val AUPRC 0.079 (base rate 0.037)
# (reports/hourly_baselines_1h.csv). Window: 168 hours of the 6 panel features of one coin.
name: lstm_1h_shock_dev
seed: 0
device: auto
deterministic: true
evaluate_test: false
data:
  version: v2
  resolution: "1h"
model:
  name: lstm
  config: configs/model/lstm.yaml
target: y_shock
loss: focal
training:
  epochs: 15
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 3
  num_workers: 0
