# DEV (validation only): v2 TGN + learning-rate schedule on validation plateaus. Question: same or better
# validation AUPRC in fewer epochs than tgn_1h_final_v2 (best epoch 98 of 100)?
name: tgn_1h_lrsched_dev
seed: 0
device: auto
deterministic: true
evaluate_test: false
data:
  version: v2
  resolution: "1h"
  network_features: true
model:
  name: tgn
  config: configs/model/tgn.yaml
training:
  epochs: 100            # v2: v1 (30 epochs, patience 4) stopped while validation AUPRC was still rising
  batch_size: 200
  num_neighbors: 10
  learning_rate: 0.0005
  weight_decay: 0.0001
  patience: 12
  lr_schedule: plateau     # halve the learning rate after 3 epochs without validation improvement (min 1e-5)
  loss: focal
