# Same as dygformer_1h_dev plus min_epochs 30 (the first dev run early-stopped at epoch 12 while still climbing).
# DEV (validation only): DyGFormer on the 1h shock-event stream, same events, splits, loss and training budget as
# the final TGN (tgn_1h_final_v2: 100 epochs, patience 10). Compare with TGN validation AUPRC 0.153 (k=1h).
name: dygformer_1h_min30_dev
seed: 0
device: auto
deterministic: true
evaluate_test: false
data:
  version: v2
  resolution: "1h"
  network_features: true
model:
  name: dygformer
  config: configs/model/dygformer.yaml
training:
  epochs: 100
  batch_size: 200
  learning_rate: 0.0005
  weight_decay: 0.0001
  patience: 10
  min_epochs: 30         # same rule as the no-memory ablation (v3): its curve dips after an early peak
  loss: focal
