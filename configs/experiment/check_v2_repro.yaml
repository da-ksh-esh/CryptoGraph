# v2 of this final config: same model and data, larger training budget (chosen from validation curves only).
# FINAL TGN contagion model (T1), 1h stream: settings frozen from tgn_1h_dev (validation only).
# Scores the test period once per seed (evaluate_test: true). Run seeds 0-4:
#   for s in 0 1 2 3 4; do cryptograph-train --config configs/experiment/tgn_1h_final_v2.yaml --seed $s; done
name: check_v2_repro
seed: 0
device: auto
deterministic: true
evaluate_test: false
data:
  version: v2
  resolution: "1h"
  network_features: true
model:
  name: tgn
  config: configs/model/tgn.yaml
training:
  epochs: 1
  batch_size: 200
  num_neighbors: 10
  learning_rate: 0.0005
  weight_decay: 0.0001
  patience: 10           # validation curves plateau for several epochs before improving again
  loss: focal
