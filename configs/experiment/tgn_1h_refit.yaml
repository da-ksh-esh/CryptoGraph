# FINAL (refit): the tgn_1h_final_v2 model retrained on train + validation (2020-07 to 2023-12) before scoring the
# test period once. The test period (2024-26) differs from 2020-22, so the 18 most recent months are worth training
# on. No early stopping (validation is training data now): epochs fixed at 77 = median best epoch + 1 of the five
# tgn_1h_final_v2 seeds (best epochs 45, 55, 76, 86, 98), chosen before looking at any refit result.
name: tgn_1h_refit
seed: 0
device: auto
deterministic: true
evaluate_test: true
data:
  version: v2
  resolution: "1h"
  network_features: true
model:
  name: tgn
  config: configs/model/tgn.yaml
training:
  refit_train_val: true
  epochs: 77
  batch_size: 200
  num_neighbors: 10
  learning_rate: 0.0005
  weight_decay: 0.0001
  loss: focal
