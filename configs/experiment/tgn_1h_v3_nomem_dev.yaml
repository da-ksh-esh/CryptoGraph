# DEV (validation only, sandbox exp/accuracy-v3): as tgn_1h_v3_dev without memory: does the graph memory add anything now?
name: tgn_1h_v3_nomem_dev
seed: 0
device: auto
deterministic: true
evaluate_test: false
data:
  version: v3
  resolution: "1h"
  network_features: true
model:
  name: tgn
  config: configs/model/tgn.yaml
  overrides: {use_memory: false, shock_size_messages: true, calendar_features: true, context_features: true}
training:
  epochs: 60
  batch_size: 200
  num_neighbors: 10
  learning_rate: 0.001
  lr_schedule: plateau     # halve the learning rate after 3 epochs without a better mean validation AUPRC
  weight_decay: 0.0001
  patience: 8
  loss: focal
  memory_step: hour
  select_on: mean          # best epoch = best mean validation AUPRC over the 5 horizons
