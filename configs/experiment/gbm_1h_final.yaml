# FINAL: gradient-boosting baseline with event context (chosen over the no-context variant on validation: AUPRC
# 0.155/0.270/0.341/0.480/0.648 vs 0.153/0.245/0.340/0.467/0.638 at k = 1/3/6/12/24h). Same events and masks as the
# TGN; trees chosen on validation per horizon; test scored once. Deterministic (no subsampling), so one seed.
name: gbm_1h_final
seed: 0
device: cpu
deterministic: true
evaluate_test: true
data:
  version: v2
  resolution: "1h"
  network_features: true
model:
  name: gbm
  context_features: true    # + shock state of both coins and market breadth at t (leakage-free)
training:
  learning_rate: 0.05
  max_leaf_nodes: 31
  min_samples_leaf: 200
  l2: 1.0
  tree_step: 50
  max_trees: 1000
  patience: 4
  batch_size: 200        # only to score the same events as the stream models
