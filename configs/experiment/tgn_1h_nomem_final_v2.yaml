# v2 of this final config: same model and data, larger training budget (chosen from validation curves only).
# FINAL ABLATION: TGN without memory / neighbour attention, 1h stream (same head, node features and message): settings frozen from tgn_1h_dev (validation only).
# Scores the test period once per seed (evaluate_test: true). Run seeds 0-4:
#   for s in 0 1 2 3 4; do cryptograph-train --config configs/experiment/tgn_1h_nomem_final_v2.yaml --seed $s; done
name: tgn_1h_nomem_final_v2
seed: 0
device: auto
deterministic: true
evaluate_test: true
data:
  version: v2
  resolution: "1h"
  network_features: true
model:
  name: tgn
  config: configs/model/tgn.yaml
  overrides: {use_memory: false}
training:
  epochs: 100            # v2: v1 (30 epochs, patience 4) stopped while validation AUPRC was still rising
  batch_size: 200
  num_neighbors: 10
  learning_rate: 0.0005
  weight_decay: 0.0001
  patience: 10           # validation curves plateau for several epochs before improving again
  loss: focal
