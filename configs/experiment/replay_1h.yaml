# Hour-by-hour replay of test-period windows through the final TGN (tgn_1h_final_v2, seed 0), for the dashboard's
# "Replay" tab: the model's calibrated risk at every hour with shock events, as it would have said it live, next to what
# then happened, with integrated-gradient drivers for the riskiest coins (serving/replay.py). Works offline.
#   cryptograph-train --config configs/experiment/replay_1h.yaml
# Only test-period windows (2024-01-01 onwards) are genuine forecasts; each window records its period.
name: replay_1h
seed: 0
device: cpu
deterministic: true
model:
  name: replay
replay:
  target_experiment: tgn_1h_final_v2
  target_seed: 0
  data_version: null        # null = the model's own data (v2); v2_live (serving/live.py) can replay live hours too
  top: 5                    # coins per hour and horizon that get drivers
  ig_steps: 32              # integrated-gradient steps (completeness gap in metrics.json)
  top_drivers: 3
  windows:                  # UTC hours, inclusive; `event` pulls the description from data/external/events.csv
    - name: "10 Jan 2024: US spot bitcoin ETF approval"         # listed first: the dashboard opens on it
      event: "US spot BTC ETF approval"
      start: "2024-01-10 09:00"
      end: "2024-01-12 09:00"
    - name: "An ordinary week (21-27 Sep 2026)"
      description: "The last week of the research data, with no catalogued crisis: how the model behaves day to day,
        when big moves are mostly single coins on their own."
      start: "2026-09-21 00:00"
      end: "2026-09-27 23:00"
    - name: "10 Oct 2025: liquidation cascade"
      event: "Oct-10 liquidation cascade"
      start: "2025-10-10 08:00"
      end: "2025-10-12 08:00"
    - name: "5 Aug 2024: yen carry-trade unwind"
      event: "Yen carry-trade unwind"
      start: "2024-08-04 19:00"
      end: "2024-08-06 19:00"
