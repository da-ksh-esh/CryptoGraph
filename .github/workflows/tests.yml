# Runs the test suite on every push and pull request (GitHub-hosted runner, private repository).
# Integration tests skip themselves here: data/ is never in git, so they only run where the artifacts are built.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install CPU PyTorch (same version as the results)
        run: pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned dependencies and the package
        run: |
          pip install -r requirements-lock.txt
          pip install -e .
      - name: Run tests
        run: pytest -q
